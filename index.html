<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI选门票 · 双月重点</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="viewport" id="viewport">
    <div class="board" id="board">
      <div class="cards" id="cards">
        <article class="card card-1"><img class="card-img" src="assets/card-1.png" alt="01 帮我选AI入口"></article>
        <article class="card card-2"><img class="card-img" src="assets/card-2.png" alt="02 表达选票诉求"></article>
        <article class="card card-3"><img class="card-img" src="assets/card-3.png" alt="03 推荐选票方案"></article>
        <article class="card card-4"><img class="card-img" src="assets/card-4.png" alt="04 选择具体门票"></article>
      </div>

      <div class="flip-mask"></div>
      <img class="fx-img fx-l" src="assets/test1-Left.png" alt="左标题">
      <img class="fx-img fx-r" src="assets/test1-Right.png" alt="右标题">
      <div class="flipped-yemian">
        <img class="yemian-layer yemian-img" src="assets/yemian1.png" alt="页面">
        <video class="yemian-layer yemian-video" playsinline webkit-playsinline preload="auto" muted loop aria-label="页面视频"></video>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
